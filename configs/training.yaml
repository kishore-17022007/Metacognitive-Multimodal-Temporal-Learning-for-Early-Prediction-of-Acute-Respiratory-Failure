seed: 42
torch: {epochs: 15, batch_size: 128, lr: 0.001, weight_decay: 0.0001, early_stopping_patience: 4, num_workers: 0}
reliability:
  calibration_method: sigmoid       # sigmoid | isotonic
  conformal_alpha: 0.10
  ood_flag_rate_on_validation: 0.05 # threshold = validation score quantile
  ece_bins: 10
  max_ensemble_std: 0.15            # review rule
  min_agreement: 0.8                # review rule
  review_probability_band: [0.3, 0.7]
profiles:
  research: {torch: {epochs: 60}}
